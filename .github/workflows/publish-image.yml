# 릴리스 태그를 밀면 컨테이너 이미지를 GHCR 에 공개한다.
#
# 왜 GHCR 인가
#   - 소스가 이미 이 리포지토리에 있어 패키지·소스·이슈가 한곳에 모인다.
#     고객이 "이 이미지가 정말 이 코드인가" 를 확인할 경로가 짧다.
#   - GITHUB_TOKEN 으로 푸시하므로 CI 에 AWS 자격증명을 두지 않는다.
#   - provenance 증명을 GitHub 이 서명해 준다.
#
# 이미지에는 시크릿이 없다. Dockerfile 이 requirements.lock, 가상환경, src/ 만
# 복사하고 .dockerignore 가 .git·tests·infra·scripts·.env·키 파일을 제외한다.
# 관리 토큰은 Secrets Manager 에서 런타임에 주입된다.
#
# 레지스트리 위치는 고객의 배포 리전과 무관하다. 프롬프트와 사용량은 고객
# 계정의 리소스 안에만 남는다.

name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "발행할 태그 (예: v1.10.0)"
        required: true

permissions:
  contents: read
  packages: write
  # provenance 증명 서명에 필요하다.
  id-token: write
  attestations: write

jobs:
  publish:
    name: GHCR 에 이미지 발행
    runs-on: ubuntu-24.04
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 태그 결정
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # 소문자만 허용된다. 리포지토리 이름이 대문자를 포함할 수 있다.
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: 버전 일관성 확인
        run: |
          # 태그와 코드의 버전이 다르면 고객이 받는 이미지와 문서가 어긋난다.
          code_version="$(grep -oP '__version__ = "\K[^"]+' src/llmgw/__init__.py)"
          tag_version="${{ steps.meta.outputs.tag }}"
          if [ "v${code_version}" != "${tag_version}" ]; then
            echo "태그(${tag_version})와 코드 버전(v${code_version})이 다르다." >&2
            exit 1
          fi
          echo "버전 일치: v${code_version}"

      - name: Buildx 준비
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: GHCR 로그인
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드와 푸시
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # latest 를 붙이지 않는다. 고객이 latest 를 쓰면 태스크가 재기동될
          # 때마다 버전이 바뀔 수 있고, 어떤 코드가 돌고 있는지 알 수 없다.
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: provenance 증명 첨부
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: 다이제스트 출력
        run: |
          echo "## 발행 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "프로덕션에서는 다이제스트로 고정하기를 권한다." >> "$GITHUB_STEP_SUMMARY"
