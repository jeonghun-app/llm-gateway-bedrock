# 포맷 → 린트 → 타입 체크 → 유닛 테스트 → IaC 검증 → 이미지 빌드 순으로
# 검증한다. 배포는 포함하지 않는다. 배포에는 OIDC 역할 설정이 선행되어야 하고,
# 그 절차는 docs/runbook.md 의 "GitHub Actions 에서 배포하기" 에 있다.
#
# 액션은 커밋 SHA 로 고정한다. 태그는 재발행될 수 있어 같은 워크플로가 다른
# 코드를 실행할 여지가 생긴다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에 새 푸시가 오면 진행 중인 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python 검증
    runs-on: ubuntu-24.04
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python 3.13 설치
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 포맷 확인 (isort)
        run: isort --check-only src tests scripts examples

      - name: 포맷 확인 (black)
        run: black --check src tests scripts examples

      - name: 린트 (ruff)
        run: ruff check src tests scripts examples

      - name: 타입 체크 (mypy)
        run: mypy

      - name: 릴리스 아티팩트 버전 일치
        # 코드 버전만 올리고 템플릿·문서를 잊는 실수를 막는다. v1.13.1 에서
        # ImageUri 기본값이 v1.11.0 으로 남아 신규 설치자가 구버전을 받았다.
        run: python scripts/check_release_consistency.py

      - name: 유닛 테스트
        run: |
          pytest -m "not browser" \
                 --cov=llmgw --cov-report=term-missing \
                 --cov-report=xml --cov-fail-under=85

      - name: 커버리지 업로드
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  browser:
    name: Chromium 관리 UI 검증
    runs-on: ubuntu-24.04
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python 3.13 설치
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 개발 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Chromium 설치
        run: python -m playwright install --with-deps chromium

      - name: 관리 UI 브라우저 테스트
        run: pytest -m browser tests/test_ui_playwright.py

  infra:
    name: IaC 와 스크립트 검증
    runs-on: ubuntu-24.04
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python 3.13 설치
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: cfn-lint 설치
        run: pip install "cfn-lint==1.28.0"

      - name: CloudFormation 템플릿 검증
        run: cfn-lint infra/ecr.yaml infra/app.yaml

      - name: 셸 스크립트 검증
        run: |
          # 러너 이미지에 shellcheck 가 이미 있다. 무조건 apt-get update 를
          # 돌리면 러너에 등록된 서드파티 저장소(azure-cli 등) 장애가 이 잡을
          # 실패시킨다. 실제로 그 저장소의 403 때문에 검증이 실행조차 되지
          # 않은 일이 있었다. 없을 때만 설치하고, 목록 갱신 실패는 무시한다.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
          shellcheck scripts/*.sh

  secrets:
    name: 시크릿 검사
    runs-on: ubuntu-24.04
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # 히스토리 전체를 검사하려면 얕은 클론이면 안 된다.
          fetch-depth: 0

      - name: 시크릿 스캔 (히스토리 포함)
        run: ./scripts/scan_secrets.sh --history

  image:
    name: 컨테이너 이미지 빌드
    runs-on: ubuntu-24.04
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Buildx 준비
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: 이미지 빌드
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: false
          load: true
          tags: llmgw:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 컨테이너 기동 확인
        run: |
          # AWS 자격증명이 없어도 헬스 체크는 통과해야 한다. /healthz 는
          # 의도적으로 AWS 를 호출하지 않는 얕은 체크다.
          docker run -d --name llmgw-ci -p 8080:8080 \
            -e AWS_REGION=us-east-1 \
            -e LLMGW_ADMIN_TOKEN=ci-token \
            llmgw:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null; then
              echo "기동 확인"
              curl -s http://127.0.0.1:8080/healthz
              exit 0
            fi
            sleep 2
          done
          echo "기동 실패. 컨테이너 로그:" >&2
          docker logs llmgw-ci >&2
          exit 1

      - name: 컨테이너 정리
        if: always()
        run: docker rm -f llmgw-ci || true
