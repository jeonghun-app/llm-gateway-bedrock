name: 버그 신고
description: 재현 가능한 결함을 신고한다
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        보안 취약점은 여기에 올리지 말고 [SECURITY.md](../blob/main/SECURITY.md)
        의 비공개 신고 절차를 따른다.
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 무엇이 잘못되었는지 한두 문장으로.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      description: 결함을 재현하는 최소한의 단계.
      placeholder: |
        1. `./scripts/deploy.sh --allowed-cidr ...` 실행
        2. `POST /v1/chat/completions` 호출
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 오류 메시지, 응답 본문, 로그(민감 정보는 가린다)를 포함한다.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 버전, 리전, 배포 방식, Python/Docker 버전 등.
      placeholder: |
        - 버전(GET /healthz 의 version): 1.3.0
        - 리전: us-east-1
        - 배포: scripts/deploy.sh
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 로그와 오류 메시지에서 자격증명·토큰·API 키를 제거했다.
          required: true
        - label: 최신 main 에서도 재현되는지 확인했다.
          required: false
